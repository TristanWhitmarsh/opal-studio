[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "opal-studio"
# The version is opal_studio.__version__ (opal_studio/__init__.py).
dynamic = ["version"]
description = "Cross-platform viewer and analysis application for multiplexed (IMC) and H&E OME-TIFF images"
readme = "README.md"
authors = [
    {name = "Tristan Whitmarsh", email = "tw401@cam.ac.uk"}
]
# The full text is in LICENSE, which setuptools adds to the sdist and wheel. Kept in
# the {text = ...} form rather than an SPDX expression (license = "LicenseRef-...",
# license-files = [...]) because that needs setuptools>=77, and the runtime pin
# below keeps setuptools<70 in the app's own environment, where
# `pip install --no-build-isolation .` builds with it.
license = {text = "MIT + Commons Clause"}
# TensorFlow 2.8 (needed by DeepCell/Mesmer) is only built for Python 3.7-3.10.
requires-python = ">=3.9,<3.11"
keywords = ["imaging mass cytometry", "IMC", "multiplexed imaging", "H&E", "OME-TIFF",
            "cell segmentation", "phenotyping", "microscopy"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
    "Topic :: Scientific/Engineering :: Image Processing",
    "Topic :: Scientific/Engineering :: Visualization",
]
dependencies = [
    "PySide6==6.4.3",
    "tifffile==2024.8.30",
    "imagecodecs==2024.12.30",
    "numpy==1.26.4",
    "scikit-image==0.24.0",
    "pandas==2.3.3",
    "tensorflow==2.8.0",
    "tensorflow-addons==0.16.1",
    "tensorflow-io-gcs-filesystem==0.26.0",
    "protobuf==3.20.3",
    "spektral==1.0.6",
    "torch==2.1.2",
    "torchvision==0.16.2",
    "einops==0.8.2",
    "deepcell==0.12.10",
    "deepcell-toolbox==0.12.1",
    "deepcell-tracking==0.6.5",
    "stardist==0.9.2",
    "csbdeep==0.8.2",
    # Virtual brightfield generation (Brightfield tab). Base install only — the
    # optional 'enhance' extra pulls tensorflow==2.14, which conflicts with the
    # Mesmer/DeepCell TF 2.8 stack, so it is intentionally not requested here.
    "multiplex2brightfield>=0.2.8",
    "cellpose==3.1.1.3",
    "omnipose==1.0.6",
    "instanseg-torch==0.1.1",
    "torchvf==0.1.4",
    "scipy==1.13.1",
    "scikit-learn==1.6.1",
    # Clustering / phenotyping / cell-table stack (imported directly by
    # clustering.py, dimensionality_reduction.py, project_io.py, main_window.py)
    "anndata==0.10.9",
    "scanpy==1.10.3",
    "phenograph==1.5.7",
    "umap-learn==0.5.12",
    "leidenalg==0.10.2",    # backend for scanpy sc.tl.leiden
    "louvain==0.8.2",       # backend for scanpy sc.tl.louvain
    "matplotlib==3.9.4",
    "pillow==11.3.0",
    "h5py==3.14.0",
    "opencv-python-headless==4.11.0.86",
    "tqdm==4.67.3",
    "natsort==8.4.0",
    "psutil==7.2.2",
    "zarr==2.18.2",
    "numcodecs==0.12.1",    # zstd chunk codec used directly by image_loader / project_io
    "geopandas==1.0.1",
    "shapely==2.0.7",
    "pyarrow==21.0.0",
    "seaborn==0.13.2",
    "peakdetect==1.2",
    "mahotas==1.4.18",
    "igraph==0.11.9",
    "roifile==2024.9.15",
    "fastremap==1.18.0",
    "fill-voids==2.1.1",
    "edt==3.1.1",
    "mgen==1.2.1",
    "ncolor==1.5.3",
    "pywin32==311; sys_platform == 'win32'",
    "setuptools>=68.0,<70.0.0",
]

[project.scripts]
opal-studio = "opal_studio.__main__:main"

[project.urls]
Homepage = "https://github.com/TristanWhitmarsh/opal-studio"
Source = "https://github.com/TristanWhitmarsh/opal-studio"
Issues = "https://github.com/TristanWhitmarsh/opal-studio/issues"
Models = "https://github.com/TristanWhitmarsh/opal-studio/releases/tag/models-v1"

[tool.setuptools.dynamic]
version = {attr = "opal_studio.__version__"}

[tool.setuptools.packages.find]
include = ["opal_studio*"]

[tool.setuptools]
include-package-data = true

[tool.setuptools.package-data]
"opal_studio" = ["icons/*", "*.png", "*.ico"]

[tool.setuptools.exclude-package-data]
# Model weights are NOT shipped in the wheel (they are ~550 MB). Opal Studio's
# own models are downloaded from the GitHub release into opal_studio/models/ on
# first use, and the segmentation libraries fetch their pretrained models
# themselves. See MODELS.md and opal_studio/model_store.py.
"opal_studio" = ["models/*", "models/**/*"]
